name: cronos_mobile
description: "CRONOS Mobile Application"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.4.9
  go_router: ^13.0.0
  dio: ^5.4.0
  google_maps_flutter: ^2.5.0
  flutter_background_geolocation: ^4.14.0
  firebase_messaging: ^14.7.9
  shared_preferences: ^2.2.2
  drift: ^2.14.0
  sqlite3_flutter_libs: ^0.5.18
  path_provider: ^2.1.1
  path: ^1.8.3
  flutter_animate: ^4.5.0
  intl: ^0.19.0
  geolocator: ^10.1.0
  google_fonts: ^6.1.0
  flutter_secure_storage: ^9.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.8
  drift_dev: ^2.14.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
